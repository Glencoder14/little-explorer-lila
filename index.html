<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Little Explorer</title><style>*{box-sizing:border-box}body{margin:0;background:#fff6e8;color:#533a35;font:600 22px system-ui;text-align:center;min-height:100dvh;padding:20px}h1{font-size:clamp(28px,5vw,48px);margin:8px}button{font:inherit;color:inherit;border:0;border-radius:24px;cursor:pointer;touch-action:manipulation;background:white;box-shadow:0 5px 0 #e8d9c8;padding:16px;min-height:64px}button:active{transform:translateY(3px)}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}nav button[aria-pressed=true]{background:#ffcc8c}#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:850px;margin:24px auto}#choices button{height:clamp(120px,27vw,220px);font-size:clamp(60px,12vw,120px);display:grid;place-items:center}#choices button.good{outline:6px solid #49ae76}#choices button.bad{opacity:.55}.shape{width:85px;height:85px;display:block;background:#8b78d7}.circle{border-radius:50%}.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.star{clip-path:polygon(50% 0,65% 35%,100% 38%,74% 62%,82% 100%,50% 80%,18% 100%,26% 62%,0 38%,35% 35%)}#feedback{min-height:42px;font-size:28px}#reward{color:#a65d00}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;top:-40px;animation:fall 1.4s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}@media(prefers-reduced-motion:reduce){.spark{display:none}}@media(max-width:480px){body{padding:10px}#choices{gap:8px}nav button{font-size:16px;padding:10px}.shape{width:55px;height:55px}}</style><h1>🌈 Little Explorer</h1><p>Play, learn & discover!</p><nav id="nav"></nav><p id="reward" aria-live="polite">⭐ 0</p><h2 id="question">Choose a game!</h2><button id="speak">🔊 Listen</button><div id="choices"></div><div id="feedback" aria-live="polite"></div><button id="next" hidden>Next ➜</button><div id="confetti"></div><script>
const sets={Colors:[['red','#ef4444'],['blue','#2583e8'],['yellow','#ffdb36'],['green','#36ad62'],['orange','#ff9638'],['purple','#a66be5'],['pink','#f28bb8']],Animals:[['dog','🐶'],['cat','🐱'],['cow','🐮'],['duck','🦆'],['lion','🦁'],['elephant','🐘'],['rabbit','🐰'],['monkey','🐵']],Shapes:[['circle','circle'],['square','square'],['triangle','triangle'],['star','star']],Vehicles:[['car','🚗'],['bus','🚌'],['airplane','✈️'],['train','🚂'],['truck','🚚'],['boat','⛵']]};const icons=['🎨','🐻','🔷','🚗'];let mode='Colors',target,score=0,locked=false;const $=id=>document.getElementById(id);function say(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function prompt(){return mode==='Colors'?'Touch '+target[0]+'!':'Find the '+target[0]+'!'}function round(audio=true){locked=false;let pool=sets[mode],old=target;target=shuffle(pool.filter(x=>x!==old))[0];$('question').textContent=prompt();$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();shuffle([target,...shuffle(pool.filter(x=>x!==target)).slice(0,2)]).forEach(item=>{let b=document.createElement('button');b.setAttribute('aria-label',item[0]);if(mode==='Colors'){b.style.background=item[1]}else if(mode==='Shapes'){let s=document.createElement('span');s.className='shape '+item[1];b.append(s)}else b.textContent=item[1];b.onclick=()=>{if(locked)return;if(item===target){locked=true;b.classList.add('good');score++;$('reward').textContent='⭐ '+score;$('feedback').textContent='Wonderful! 🌟';$('next').hidden=false;say('Wonderful! '+target[0]+'!');for(let i=0;i<16;i++){let s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🌈'][i%3];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.3+'s';$('confetti').append(s);setTimeout(()=>s.remove(),1900)}}else{b.classList.add('bad');$('feedback').textContent='Try again! 💛';say('Try again. '+prompt())}};$('choices').append(b)});if(audio)say(prompt())}Object.keys(sets).forEach((m,i)=>{let b=document.createElement('button');b.textContent=icons[i]+' '+m;b.setAttribute('aria-pressed',m===mode);b.onclick=()=>{mode=m;target=null;[...$('nav').children].forEach(x=>x.setAttribute('aria-pressed',x===b));round()};$('nav').append(b)});$('speak').onclick=()=>say(prompt());$('next').onclick=()=>round();round(false);
</script></html>
